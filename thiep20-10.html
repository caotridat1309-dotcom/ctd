<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi cậu tấm thiệp 20/10 🌸</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        #cover {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 1s ease;
        }
        
        .btn-open {
            padding: 15px 40px;
            font-size: 24px;
            color: white;
            background: #ff758c;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 117, 140, 0.4);
            animation: pulse 1.5s infinite;
            transition: transform 0.3s;
            font-weight: bold;
        }
        
        .btn-open:hover {
            transform: scale(1.1);
        }
        
        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 117, 140, 0.7);
            }
            70% {
                box-shadow: 0 0 0 20px rgba(255, 117, 140, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(255, 117, 140, 0);
            }
        }
        
        #card {
            display: none;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            padding: 40px;
            max-width: 85%;
            width: 450px;
            text-align: center;
            color: #333;
            z-index: 5;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.2);
            transform: scale(0.8);
            animation: popIn 0.8s forwards;
        }
        
        @keyframes popIn {
            to {
                transform: scale(1);
            }
        }
        
        h1 {
            color: #d6336c;
            font-size: 2.2em;
            margin-top: 0;
        }
        
        p {
            font-size: 1.15em;
            line-height: 1.6;
            color: #444;
            margin-bottom: 15px;
        }
        
        .floating-item {
            position: absolute;
            top: -10%;
            z-index: 1;
            user-select: none;
            animation: fall linear forwards;
        }
        
        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <!-- Màn hình chờ mở thiệp -->
    <div id="cover">
        <button class="btn-open" onclick="openCard()">Mở Thiệp 💌</button>
    </div>

    <!-- Nội dung thiệp -->
    <div id="card">
        <h1>Chúc Mừng 20/10! 🌸</h1>
        <p>Nhân ngày Phụ nữ Việt Nam, chúc cậu luôn vui vẻ, rạng rỡ và xinh đẹp như những đóa hoa.</p>
        <p>Mong cậu luôn giữ được nụ cười trên môi và gặt hái được thật nhiều niềm vui trong cuộc sống. Cậu xứng đáng với những điều tuyệt vời nhất! ❤️</p>
    </div>

    <!-- Script tạo hiệu ứng -->
    <script>
        function openCard() {
            document.getElementById('cover').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('cover').style.display = 'none';
                document.getElementById('card').style.display = 'block';
            }, 800);
        }

        function createFloatingItem() {
            const item = document.createElement('div');
            item.classList.add('floating-item');
            const items = ['🌸', '💖', '✨', '🌷'];
            item.innerText = items[Math.floor(Math.random() * items.length)];
            item.style.left = Math.random() * 100 + 'vw';
            item.style.animationDuration = Math.random() * 3 + 2 + 's';
            item.style.fontSize = Math.random() * 20 + 15 + 'px';
            document.body.appendChild(item);

            setTimeout(() => {
                item.remove();
            }, 5000);
        }
        setInterval(createFloatingItem, 300);
    </script>
</body>

</html>
